services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twsd_connect_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - twsd_network

  nginx:
    image: nginx:1.27-alpine
    container_name: twsd_connect_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - twsd_network

  mysql:
    image: mysql:8.0
    container_name: twsd_connect_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-twsd_connect}
      MYSQL_USER: ${DB_USERNAME:-twsd_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - twsd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - twsd_network

  redis:
    image: redis:7-alpine
    container_name: twsd_connect_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}" --appendonly yes
    volumes:
      - twsd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - twsd_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twsd_connect_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=60
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - twsd_network

volumes:
  twsd_mysql_data:
  twsd_redis_data:

networks:
  twsd_network:
    driver: bridge
